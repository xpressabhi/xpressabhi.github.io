<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep dive · Abhishek Kumar Maurya</title>
<meta name="description" content="Technical writeups of the ServiceNow systems">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfcfc;
    --surface: #f5f3f1;
    --ink: #171512;
    --muted: #777169;
    --dim: #a59f97;
    --faint: #b1b0b0;
    --line: #e5e5e5;
    --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110;
      --surface: #1e1c19;
      --ink: #f0ece6;
      --muted: #b4ada4;
      --dim: #8a847c;
      --faint: #6f6a63;
      --line: #2c2925;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-display); font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav {
    max-width: 860px; margin: 0 auto; padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
  .mark-sq {
    width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  }
  .nav-file { font-family: var(--font-mono); font-size: 12px; color: var(--dim); max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-back { font-size: 14px; color: var(--muted); }
  .nav-back:hover { color: var(--ink); }

  main { max-width: 860px; margin: 0 auto; padding: 56px 32px 96px; }

  .reader h1 {
    font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.02em;
    line-height: 1.15; margin-bottom: 32px;
  }
  .reader h2 {
    font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
    margin: 40px 0 14px; padding-top: 24px; border-top: 1px solid var(--line);
  }
  .reader h3 { font-size: 17px; font-weight: 600; margin: 28px 0 10px; }
  .reader h4 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; }
  .reader p { color: var(--muted); margin-bottom: 14px; max-width: 72ch; }
  .reader ul, .reader ol { color: var(--muted); margin: 0 0 16px 22px; }
  .reader li { margin-bottom: 6px; }
  .reader li::marker { color: var(--dim); }
  .reader strong { color: var(--ink); font-weight: 600; }
  .reader em { color: var(--ink); }
  .reader a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--dim); }
  .reader a:hover { text-decoration-color: var(--ink); }
  .reader hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }
  .reader code {
    font-family: var(--font-mono); font-size: 0.86em;
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 6px;
  }
  .reader pre {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin: 0 0 16px; overflow-x: auto;
  }
  .reader pre code { background: none; border: 0; padding: 0; font-size: 13px; line-height: 1.6; }
  .reader blockquote {
    border-left: 3px solid var(--dim); padding: 2px 0 2px 18px;
    color: var(--dim); font-style: italic; margin: 0 0 16px;
  }
  .reader table { border-collapse: collapse; margin: 0 0 16px; font-size: 14.5px; max-width: 100%; display: block; overflow-x: auto; }
  .reader th, .reader td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; color: var(--muted); }
  .reader th { background: var(--surface); color: var(--ink); font-weight: 600; }

  .reader-foot { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--dim); }
  .reader-foot a { color: var(--muted); }
  .reader-foot a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  .status { color: var(--dim); font-size: 15px; padding: 40px 0; max-width: 60ch; }
  .status.error { color: #9a2f2f; }
  @media (prefers-color-scheme: dark) { .status.error { color: #e08a8a; } }

  @media (max-width: 768px) {
    nav, main { padding-left: 24px; padding-right: 24px; }
    main { padding-top: 40px; }
    .nav-file { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="../" class="mark" aria-label="Back to portfolio">
      <span class="mark-sq">AM</span> Abhishek Kumar Maurya
    </a>
    <div class="nav-file" id="nav-file"></div>
    <a href="../" class="nav-back">← Back</a>
  </nav>
</header>

<main>
  <article class="reader" id="reader">
    <p class="status">Loading…</p>
  </article>
  <div class="reader-foot">
    <a href="../">← Back to portfolio</a>
    <a href="../#work">All deep dives</a>
  </div>
</main>

<script>
(function () {
  "use strict";

  var file = new URLSearchParams(location.search).get("file") || "";
  var reader = document.getElementById("reader");
  var navFile = document.getElementById("nav-file");

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, function (_, c) { return "<code>" + esc(c) + "</code>"; })
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function renderMarkdown(md) {
    var lines = md.replace(/\r\n?/g, "\n").split("\n");
    var html = [];
    var i = 0;

    function para() {
      var buf = [];
      while (i < lines.length) {
        var line = lines[i];
        if (line.trim() === "") break;
        if (/^(#{1,4} |```|[-*_] ?[-*_][-*_ ]*$|\|)/.test(line)) break;
        buf.push(line);
        i++;
      }
      if (buf.length) html.push("<p>" + inline(esc(buf.join(" "))) + "</p>");
    }

    function list(ordered) {
      var tag = ordered ? "ol" : "ul";
      var items = [];
      while (i < lines.length) {
        var line = lines[i];
        var m = ordered
          ? line.match(/^\s*\d+[.)]\s+(.*)$/)
          : line.match(/^\s*[-*+]\s+(.*)$/);
        if (!m) break;
        items.push("<li>" + inline(esc(m[1])) + "</li>");
        i++;
      }
      if (items.length) html.push("<" + tag + ">" + items.join("") + "</" + tag + ">");
    }

    function table() {
      var rows = [];
      while (i < lines.length && lines[i].includes("|")) {
        rows.push(lines[i]);
        i++;
      }
      if (rows.length < 2) return;
      var split = function (r) {
        return r.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
      };
      var head = split(rows[0]);
      var body = rows.slice(1).filter(function (r) { return !/^\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*$/.test(r); });
      var out = "<table><thead><tr>";
      head.forEach(function (c) { out += "<th>" + inline(esc(c)) + "</th>"; });
      out += "</tr></thead><tbody>";
      body.forEach(function (r) {
        out += "<tr>";
        split(r).forEach(function (c) { out += "<td>" + inline(esc(c)) + "</td>"; });
        out += "</tr>";
      });
      html.push(out + "</tbody></table>");
    }

    while (i < lines.length) {
      var line = lines[i];

      if (line.trim() === "") { i++; continue; }

      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        i++;
        var code = [];
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        html.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        continue;
      }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        html.push("<h" + level + ">" + inline(esc(h[2])) + "</h" + level + ">");
        i++;
        continue;
      }

      if (/^[-*_]\s*[-*_]\s*[-*_]+\s*$/.test(line)) {
        html.push("<hr>");
        i++;
        continue;
      }

      var bq = line.match(/^>\s?(.*)$/);
      if (bq) {
        var q = [];
        while (i < lines.length) {
          var m = lines[i].match(/^>\s?(.*)$/);
          if (!m) break;
          q.push(m[1]);
          i++;
        }
        html.push("<blockquote>" + inline(esc(q.join(" "))) + "</blockquote>");
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) { list(false); continue; }
      if (/^\s*\d+[.)]\s+/.test(line)) { list(true); continue; }
      if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
        table();
        continue;
      }

      para();
    }
    return html.join("\n");
  }

  if (location.protocol === "file:") {
    reader.innerHTML =
      '<p class="status error">Opening from disk blocks the browser from reading the .md file (file:// security). ' +
      'Serve this folder locally (<code>python3 -m http.server</code>) or view the live site: ' +
      '<a href="https://xpressabhi.github.io/deep-dives/?file=' + encodeURIComponent(file) + '" style="text-decoration:underline">' +
      'xpressabhi.github.io/deep-dives/' + esc(file) + '</a>.</p>';
    return;
  }

  if (!/^[a-z0-9-]+\.md$/i.test(file)) {
    reader.innerHTML = '<p class="status error">No document specified.</p>';
    return;
  }
  navFile.textContent = file;
  document.title = file.replace(/\.md$/i, "") + " · Abhishek Kumar Maurya";

  fetch(file)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function (md) {
      reader.innerHTML = renderMarkdown(md);
    })
    .catch(function () {
      reader.innerHTML = '<p class="status error">Could not load ' + esc(file) + " — it may have moved.</p>";
    });
})();
</script>

</body>
</html>
