<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · {{name}}</title>
<meta name="description" content="Long-form technical writeups on AI agents, MCP workflows, and developer platforms.">
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root { --bg: #ffffff; --ink: #1a1a1a; --muted: #616161; --faint: #9a9a9a; --line: #ececea; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f0f0e; --ink: #ececec; --muted: #a8a8a8; --faint: #6e6e6e; --line: #232323; }
  }
  :root[data-theme="dark"] { --bg: #0f0f0e; --ink: #ececec; --muted: #a8a8a8; --faint: #6e6e6e; --line: #232323; color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  a { color: inherit; }
  .wrap { max-width: 700px; margin: 0 auto; padding: 0 24px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav { max-width: 700px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .mark { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; text-decoration: none; }
  .nav-links { display: flex; align-items: center; gap: 20px; font-size: 14px; }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a:hover { color: var(--ink); }
  .theme-btn { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .theme-btn:hover { color: var(--ink); border-color: var(--faint); }
  .blog-head { padding: 56px 0 0; }
  .kicker { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
  .blog-head h1 { font-size: clamp(32px, 5vw, 44px); font-weight: 650; letter-spacing: -0.03em; }
  .blog-sub { margin-top: 10px; font-size: 16px; color: var(--muted); max-width: 56ch; }
  .posts { margin-top: 32px; border-top: 1px solid var(--line); padding-bottom: 32px; }
  a.post { display: block; padding: 22px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  a.post:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
  .post-meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--faint); }
  a.post h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.015em; margin: 6px 0 4px; line-height: 1.35; }
  .post-excerpt { color: var(--muted); font-size: 14.5px; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; font-size: 13.5px; color: var(--faint); }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  @media (max-width: 640px) {
    .blog-head { padding-top: 40px; }
    .nav-links a:not(.cv):not(.blog-link) { display: none; }
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="../" class="mark">{{name}}</a>
    <div class="nav-links">
      <a href="../#work">Work</a>
      <a href="../#experience">Experience</a>
      <a href="../#projects">Projects</a>
      <a href="./" class="blog-link">Blog</a>
      <a href="../resume/" class="cv">CV</a>
      <button type="button" class="theme-btn" data-theme-btn>◐ System</button>
    </div>
  </nav>
</header>

<main class="wrap">
  <div class="blog-head">
    <div class="kicker">Writing · Deep dives</div>
    <h1>Blog</h1>
    <p class="blog-sub">Long-form technical writeups — AI agents, MCP workflows, and developer platforms.</p>
  </div>

  <div class="posts">
    {{#each posts}}
    <a class="post" href="{{slug}}.html">
      <div class="post-meta">{{#if featured}}Featured · {{/if}}{{updated}} · {{read}}</div>
      <h2>{{title}}</h2>
      <p class="post-excerpt">{{excerpt}}</p>
    </a>
    {{/each}}
  </div>
</main>

<footer>
  <div class="wrap">
    <span>{{name}}</span>
    <span><a href="../">Home</a> · <a href="../resume/">CV</a> · <a href="mailto:{{email}}">{{email}}</a></span>
  </div>
</footer>

<script>
  (function () {
    var btn = document.querySelector("[data-theme-btn]");
    if (!btn) return;
    function current() { return document.documentElement.getAttribute("data-theme") || "system"; }
    function label(t) { return t === "light" ? "○ Light" : t === "dark" ? "● Dark" : "◐ System"; }
    function paint() {
      btn.textContent = label(current());
      btn.setAttribute("aria-label", "Color theme: " + current() + ". Activate to change.");
    }
    btn.addEventListener("click", function () {
      var next = { system: "light", light: "dark", dark: "system" }[current()] || "system";
      try {
        if (next === "system") localStorage.removeItem("theme");
        else localStorage.setItem("theme", next);
      } catch (e) {}
      if (next === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      paint();
    });
    paint();
  })();
</script>
<script>
  (function () {
    document.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href");
      if (!h || h.charAt(0) === "#" || /^(mailto|tel):/i.test(h)) return;
      if (/^https?:\/\//i.test(h) && h.indexOf(location.origin) !== 0) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
  })();
</script>

</body>
</html>
